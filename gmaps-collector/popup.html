<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Google Maps 商家采集器</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3250;
      --accent: #4f8ef7;
      --accent-glow: rgba(79,142,247,0.25);
      --green: #22c55e;
      --green-glow: rgba(34,197,94,0.2);
      --red: #ef4444;
      --yellow: #f59e0b;
      --text: #e8eaf6;
      --text-muted: #7880a0;
      --text-dim: #4a5080;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 380px;
      min-height: 520px;
      background: var(--bg);
      font-family: 'Inter', system-ui, sans-serif;
      color: var(--text);
      overflow-x: hidden;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #1a1d27 0%, #0f1117 100%);
      border-bottom: 1px solid var(--border);
      padding: 16px 18px 14px;
      position: relative;
      overflow: hidden;
    }
    .header::before {
      content: '';
      position: absolute;
      top: -40px; right: -40px;
      width: 120px; height: 120px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      pointer-events: none;
    }
    .header-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 4px;
    }
    .logo {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--accent), #7c3aed);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
    }
    h1 {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.3px;
    }
    .subtitle {
      font-size: 11px;
      color: var(--text-muted);
      margin-left: 42px;
    }

    /* Status Badge */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--text-dim);
      transition: all 0.3s;
      flex-shrink: 0;
    }
    .status-dot.running {
      background: var(--green);
      box-shadow: 0 0 8px var(--green-glow);
      animation: pulse 1.2s infinite;
    }
    .status-dot.done { background: var(--accent); box-shadow: 0 0 8px var(--accent-glow); }
    .status-dot.error { background: var(--red); }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.85); }
    }
    #status-text {
      font-size: 12px;
      color: var(--text-muted);
      flex: 1;
    }
    #count-badge {
      background: var(--surface2);
      color: var(--accent);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    /* Progress bar */
    .progress-wrap {
      height: 3px;
      background: var(--surface2);
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), #7c3aed);
      transition: width 0.4s ease;
    }
    .progress-bar.animate {
      animation: progress-indeterminate 1.5s infinite;
    }
    @keyframes progress-indeterminate {
      0% { transform: translateX(-100%); width: 60%; }
      100% { transform: translateX(200%); width: 60%; }
    }

    /* Buttons */
    .btn-group {
      display: flex;
      gap: 8px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }
    .btn {
      flex: 1;
      padding: 9px 12px;
      border: none;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      letter-spacing: 0.2px;
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #3b6fd4);
      color: #fff;
      box-shadow: 0 2px 12px var(--accent-glow);
    }
    .btn-primary:hover { box-shadow: 0 4px 20px var(--accent-glow); filter: brightness(1.1); }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; filter: none; box-shadow: none; }
    .btn-danger {
      background: rgba(239,68,68,0.15);
      color: var(--red);
      border: 1px solid rgba(239,68,68,0.3);
    }
    .btn-danger:hover { background: rgba(239,68,68,0.25); }
    .btn-danger:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-secondary {
      background: var(--surface2);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { color: var(--text); border-color: var(--accent); }
    .btn-secondary:disabled { opacity: 0.35; cursor: not-allowed; }

    /* Export buttons */
    .export-group {
      display: flex;
      gap: 8px;
      padding: 0 18px 14px;
      border-bottom: 1px solid var(--border);
    }
    .btn-export {
      flex: 1;
      padding: 8px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-family: 'Inter', sans-serif;
    }
    .btn-export:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-csv {
      background: rgba(34,197,94,0.12);
      color: var(--green);
      border: 1px solid rgba(34,197,94,0.3);
    }
    .btn-csv:hover:not(:disabled) { background: rgba(34,197,94,0.2); }
    .btn-json {
      background: rgba(245,158,11,0.12);
      color: var(--yellow);
      border: 1px solid rgba(245,158,11,0.3);
    }
    .btn-json:hover:not(:disabled) { background: rgba(245,158,11,0.2); }
    .btn-html {
      background: rgba(139,92,246,0.12);
      color: #a78bfa;
      border: 1px solid rgba(139,92,246,0.3);
    }
    .btn-html:hover:not(:disabled) { background: rgba(139,92,246,0.2); }

    /* Data table */
    .data-section {
      padding: 12px 18px;
    }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }
    .data-list {
      max-height: 220px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    .data-list::-webkit-scrollbar { width: 4px; }
    .data-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .data-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 9px 12px;
      margin-bottom: 6px;
      transition: border-color 0.2s;
    }
    .data-item:hover { border-color: var(--accent); }
    .item-name {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-meta {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .item-rating {
      font-size: 11px;
      color: var(--yellow);
      font-weight: 600;
    }
    .item-reviews {
      font-size: 10px;
      color: var(--text-dim);
    }
    .item-cat {
      font-size: 10px;
      color: var(--text-muted);
      background: var(--surface2);
      padding: 1px 6px;
      border-radius: 4px;
    }
    .item-addr {
      font-size: 10px;
      color: var(--text-dim);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 24px 18px;
      color: var(--text-dim);
    }
    .empty-icon { font-size: 28px; margin-bottom: 8px; }
    .empty-text { font-size: 12px; }

    /* Tip */
    .tip {
      margin: 0 18px 14px;
      padding: 9px 12px;
      background: rgba(79,142,247,0.08);
      border: 1px solid rgba(79,142,247,0.2);
      border-radius: 7px;
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.5;
    }
    .tip strong { color: var(--accent); }

    /* Not on maps */
    .not-maps {
      padding: 28px 20px;
      text-align: center;
    }
    .not-maps .icon { font-size: 36px; margin-bottom: 12px; }
    .not-maps h2 { font-size: 14px; color: var(--text); margin-bottom: 8px; }
    .not-maps p { font-size: 12px; color: var(--text-muted); line-height: 1.5; }
    .open-maps-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 14px;
      padding: 9px 16px;
      background: linear-gradient(135deg, var(--accent), #3b6fd4);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .open-maps-btn:hover { filter: brightness(1.1); }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-top">
      <div class="logo">📍</div>
      <h1>Google Maps 商家采集器</h1>
    </div>
    <div class="subtitle">自动采集搜索结果中的所有商家信息</div>
  </div>

  <div id="main-content">
    <!-- 动态内容 -->
  </div>

  <script src="popup.js"></script>
</body>
</html>
