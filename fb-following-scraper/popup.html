<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 240px; font-family: sans-serif; padding: 10px; }
    button { width: 100%; margin-bottom: 8px; padding: 8px; cursor: pointer; }
    button:disabled { cursor: not-allowed; }
    #status { font-size: 13px; color: #555; }
  </style>
</head>
<body>
  <label><span id="languageLabel">Ngôn ngữ</span><select id="language"><option value="vi">Tiếng Việt</option><option value="zh">中文</option></select></label>
  <button id="btnStart">Bắt đầu cào</button>
  <button id="btnStop" disabled>Dừng</button>
  <button id="btnExport" disabled>Xuất CSV (0)</button>
  <div id="status">Trạng thái: Sẵn sàng</div>
  <script src="popup.js"></script>
</body>
</html>
